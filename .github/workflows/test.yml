name: Test notifier
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node tests/discovery-runtime.mjs
      - run: node tests/discovery-runtime.mjs
        env:
          NATIONS_TEST_DM: '1'
      - run: node tests/discovery-runtime.mjs
        env:
          NATIONS_TEST_SHARED: '1'
      - run: node tests/subscriptions-runtime.mjs
